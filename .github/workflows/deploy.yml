name: deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The one GH secret: this project's 1Password service-account token (see
    # new-project skill). It authenticates op for reading the deploy creds.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: 1Password/install-cli-action@v4
      # op:// refs here are BY NAME on purpose: op-project-bootstrap parses this file to
      # provision/verify the vault + items, and names are its input (an ID cannot name a
      # vault that does not exist yet). The ONE exception to the IDs-over-names rule.
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          CLOUDFLARE_API_TOKEN: op://Life Data/Life Data Deploy Creds/api-token
          CLOUDFLARE_ACCOUNT_ID: op://Life Data/Life Data Deploy Creds/account-id
      - working-directory: worker
        run: bunx wrangler@4 deploy
