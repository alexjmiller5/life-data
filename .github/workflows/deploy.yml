name: deploy

on:
  push:
    branches: [main]
    # core/ is in here because the hub bundles life-core's validator.
    paths: ["worker/**", "core/**", "scripts/generate-core-contract.ts", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      - working-directory: worker
        run: bun test
      - working-directory: core
        run: bun install --frozen-lockfile && bun test && bun run check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The one GH secret: this project's 1Password service-account token (see
    # new-project skill). It authenticates op for reading the deploy creds.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: 1Password/install-cli-action@v4
      # op:// refs here are BY NAME on purpose: op-project-bootstrap parses this file to
      # provision/verify the vault + items, and names are its input (an ID cannot name a
      # vault that does not exist yet). The ONE exception to the IDs-over-names rule.
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          CLOUDFLARE_API_TOKEN: op://Life Data/Life Data CI Cloudflare Token/api-token
          CLOUDFLARE_ACCOUNT_ID: op://Life Data/Life Data CI Cloudflare Token/account-id
          APNS_CONFIG: op://Life Data/Life Data ENV/APNS_CONFIG
          APNS_PRIVATE_KEY: op://Life Data/Life Data ENV/APNS_PRIVATE_KEY
          ENROLLMENT_PROFILES: op://Life Data/Life Data ENV/ENROLLMENT_PROFILES
          ROW_CREATION_POLICIES: op://Life Data/Life Data ENV/ROW_CREATION_POLICIES
          BACKUP_API_TOKEN: op://Life Data/Life Data ENV/BACKUP_API_TOKEN
      # Every deploy pushes these from the ENV item, so the vault is the source of truth.
      # ENROLLMENT_PROFILES travels gzip-compressed: one secret is capped at 5.1 kB.
      - name: Sync service secrets
        working-directory: worker
        run: |
          bun -e 'const names=["APNS_CONFIG","APNS_PRIVATE_KEY","ENROLLMENT_PROFILES","ROW_CREATION_POLICIES","BACKUP_API_TOKEN"];const v=Object.fromEntries(names.map(n=>[n,process.env[n]]));v.ENROLLMENT_PROFILES="gzip:"+Buffer.from(Bun.gzipSync(v.ENROLLMENT_PROFILES)).toString("base64");process.stdout.write(JSON.stringify(v))' | bunx wrangler@4 secret bulk
      - working-directory: worker
        run: bunx wrangler@4 deploy
